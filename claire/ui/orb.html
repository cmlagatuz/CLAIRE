<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C.L.A.I.R.E.</title>
<style>
  :root {
    --bg: #0a0b13; --vig: #07080d; --ink: #d7daea; --dim: #7c8199; --line: rgba(255,255,255,.09);
    --glass: rgba(18,20,32,.72); --accent: #8fa8ff; --err: #ff8a8a; --hover: rgba(255,255,255,.12);
    --soft: rgba(255,255,255,.06); --shadow: #000; --panel: rgba(14,16,26,.94); --ph: #5d627a;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #f3f4f9; --vig: #e3e6f1; --ink: #1d2136; --dim: #626883; --line: rgba(20,24,50,.14);
    --glass: rgba(255,255,255,.78); --accent: #3d5bd9; --err: #c43b3b; --hover: rgba(20,24,50,.09);
    --soft: rgba(20,24,50,.05); --shadow: #fff; --panel: rgba(250,251,255,.96); --ph: #8a90a8;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 90% at 50% 38%, transparent 0%, var(--vig) 100%), var(--bg);
    color: var(--ink); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; overflow: hidden;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .top { position: fixed; top: 18px; left: 22px; right: 22px; display: flex; justify-content: space-between;
         align-items: flex-start; pointer-events: none; }
  .brand { letter-spacing: .32em; font-size: 12px; color: var(--dim); text-transform: uppercase; }
  .state { margin-top: 6px; display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--ink); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); box-shadow: 0 0 0 0 transparent;
         transition: background .4s, box-shadow .4s; }
  .dot.listening { background: #5fd8ff; box-shadow: 0 0 12px 2px #5fd8ff88; }
  .dot.thinking  { background: #a58cff; box-shadow: 0 0 12px 2px #a58cff88; }
  .dot.speaking  { background: #ffb38a; box-shadow: 0 0 12px 2px #ffb38a88; }
  .dot.offline   { background: #55586a; }
  .meta { text-align: right; font-size: 12px; color: var(--dim); max-width: 46vw; }
  .tools { display: flex; gap: 6px; justify-content: flex-end; margin-bottom: 6px; pointer-events: auto; }
  .tools button { padding: 4px 10px; font-size: 12px; }

  .stage { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 20px 22px; display: flex;
           flex-direction: column; align-items: center; gap: 12px; pointer-events: none; }
  .caption { width: min(720px, 100%); text-align: center; min-height: 3.2em; transition: opacity 1.2s; }
  .caption.fade { opacity: 0; }
  .you { font-size: 13px; color: var(--dim); margin-bottom: 4px; }
  .answer { font-size: 17px; color: var(--ink); text-shadow: 0 1px 12px var(--shadow); white-space: pre-wrap; }
  .note { font-size: 13px; color: var(--dim); }
  .note.err { color: var(--err); }

  .ask { pointer-events: auto; width: min(720px, 100%); display: none; align-items: center; gap: 10px; padding: 10px 14px;
         background: var(--glass); border: 1px solid var(--line); border-left: 3px solid #a58cff; border-radius: 16px;
         backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .ask.on { display: flex; }
  .ask .q { flex: 1; font-size: 15px; color: var(--ink); overflow-wrap: anywhere; }
  .ask .q small { display: block; color: var(--dim); font-size: 12px; margin-top: 2px; }
  .ask .yes { border-color: #a58cff; }
  .ask { flex-wrap: wrap; }
  .ask pre { flex-basis: 100%; margin: 4px 0 0; max-height: 28vh; overflow: auto; font-size: 12px; line-height: 1.45;
             color: var(--dim); background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px;
             white-space: pre-wrap; }
  .ev { font-size: 12px; color: var(--dim); }
  .ev.bad { color: var(--err); }
  .dock { pointer-events: auto; width: min(720px, 100%); display: flex; gap: 8px; padding: 8px;
          background: var(--glass); border: 1px solid var(--line); border-radius: 18px;
          backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .dock input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--ink);
                font: inherit; padding: 8px 10px; }
  .dock input::placeholder, .add input::placeholder { color: var(--ph); }
  button { font: inherit; font-size: 13px; color: var(--ink); background: var(--soft);
           border: 1px solid var(--line); border-radius: 12px; padding: 7px 12px; cursor: pointer;
           transition: background .2s, border-color .2s, color .2s; white-space: nowrap; }
  button:hover { background: var(--hover); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 24%, transparent); border-color: var(--accent); }
  button.talk { background: rgba(95,216,255,.14); border-color: rgba(95,216,255,.45); }

  .panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); background: var(--panel);
           border-left: 1px solid var(--line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
           display: flex; flex-direction: column; transform: translateX(105%); transition: transform .3s ease; z-index: 5; }
  .panel.open { transform: none; }
  .panel header { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .panel header .tabs { display: flex; gap: 6px; flex: 1; }
  .panel .list { flex: 1; overflow-y: auto; padding: 8px 16px; }
  .item { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .item .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .item .sub { font-size: 12px; color: var(--dim); }
  .item .star { color: #f5a03a; }
  .item button { padding: 2px 8px; font-size: 12px; }
  .empty { color: var(--dim); padding: 18px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .add { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .add input[type=text] { flex: 1; min-width: 0; background: var(--soft); border: 1px solid var(--line);
                          border-radius: 10px; color: var(--ink); font: inherit; padding: 7px 10px; }
  .add label { font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 5px; }
  .add[hidden] { display: none; }
  .item .who { font-weight: 600; }
  .item .now { color: var(--accent); }
  .item .acts { display: flex; gap: 6px; }
  @media (max-width: 560px) { .dock { flex-wrap: wrap; } .dock input { flex-basis: 100%; } .meta { display: none; } }
  @media (prefers-reduced-motion: reduce) { .caption, .dot, .panel { transition: none; } }
</style>
</head>
<body>
<canvas id="orb" aria-hidden="true"></canvas>

<div class="top">
  <div>
    <div class="brand">C.L.A.I.R.E.</div>
    <div class="state" role="status" aria-live="polite"><span class="dot offline" id="dot"></span><span id="stateText">Connecting…</span></div>
  </div>
  <div>
    <div class="tools">
      <button type="button" id="voiceBtn" title="Choose how I sound">Voice</button>
      <button type="button" id="memBtn" title="What I remember, and my journal">Memory</button>
      <button type="button" id="themeBtn" title="Light or dark">Theme: auto</button>
    </div>
    <div class="meta" id="meta"></div>
  </div>
</div>

<aside class="panel" id="panel" aria-label="Memory and journal" aria-hidden="true">
  <header>
    <div class="tabs">
      <button type="button" id="tabMem" aria-pressed="true">Memories</button>
      <button type="button" id="tabJour" aria-pressed="false">Journal</button>
      <button type="button" id="tabVoice" aria-pressed="false">Voice</button>
      <button type="button" id="tabHands" aria-pressed="false">Actions</button>
    </div>
    <button type="button" id="panelClose" aria-label="Close panel">✕</button>
  </header>
  <div class="list" id="list"></div>
  <div class="add" id="speedBox" hidden>
    <label for="speed" style="flex:1">Speed <span id="speedVal">1.0</span>
      <input type="range" id="speed" min="0.7" max="1.4" step="0.05" value="1" style="flex:1;min-width:120px"></label>
    <span class="sub" style="font-size:12px;color:var(--dim)">or just say “faster” / “slower”</span>
  </div>
  <form class="add" id="addForm" autocomplete="off">
    <input type="text" id="addText" maxlength="500" placeholder="Tell me something to remember…" aria-label="New entry">
    <label id="coreLbl"><input type="checkbox" id="addCore"> core fact about me</label>
    <button type="submit">Add</button>
  </form>
</aside>

<div class="stage">
  <div class="caption fade" id="caption" aria-live="polite">
    <div class="you" id="you"></div>
    <div class="answer" id="answer"></div>
    <div class="note" id="note"></div>
  </div>
  <div class="ask" id="ask" role="alertdialog" aria-live="assertive" aria-label="Claire is asking permission">
    <div class="q" id="askQ"></div>
    <button type="button" class="yes" id="askYes">Yes</button>
    <button type="button" id="askNo">No</button>
    <button type="button" id="askAlways" title="Do this kind of thing without asking again">Always</button>
  </div>
  <form class="dock" id="form" autocomplete="off">
    <input id="text" type="text" placeholder="Type to Claire…" aria-label="Message to Claire" maxlength="4000">
    <button type="button" class="talk" id="talk" title="Speak to her (Ctrl+Space)">Talk</button>
    <button type="button" id="hf" aria-pressed="false" title='Listen for "Hey Claire"'>Hands-free</button>
    <button type="button" id="mode" title="When she answers aloud">Voice: auto</button>
    <button type="button" id="stop" title="Stop talking (Esc)">Stop</button>
  </form>
</div>

<noscript>Her window needs JavaScript.</noscript>
<script>
"use strict";
const TOKEN = "__TOKEN__";
const $ = id => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const MOTION = reduce ? 0.35 : 1;

/* ============================================================ the network ============================================================ */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = mulberry32(20260610);                         // same shape every time: she has a face
const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const PALETTE = ["#e5595b", "#f5a03a", "#5b8fd1", "#5fc4b0", "#f7d548", "#ec8fb4", "#5bb24d", "#d4d4da", "#a98370"];
const RGB = PALETTE.map(h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)));

const nodes = [], edges = [];
const addNode = (x, y, z, c, hub, size) => { nodes.push({ x, y, z, c, hub, size, ph: rnd() * 6.283, r: Math.hypot(x, y, z) }); return nodes.length - 1; };
const addEdge = (a, b) => { if (a !== b) edges.push([a, b]); };

const core = addNode(0, 0, 0, 2, true, 7.5);              // the central hub
const hubs = [core];
const members = [];
const CLUSTERS = 15;
for (let k = 0; k < CLUSTERS; k++) {
  const col = k % PALETTE.length;
  let dx = gauss(), dy = gauss(), dz = gauss(); const dl = Math.hypot(dx, dy, dz) || 1;
  const dist = 0.18 + rnd() * 0.42;
  const cx = dx / dl * dist, cy = dy / dl * dist, cz = dz / dl * dist;
  const hub = addNode(cx, cy, cz, col, true, 3.4 + rnd() * 1.8);
  hubs.push(hub); addEdge(hub, core);
  const n = 40 + Math.floor(rnd() * 44), sigma = 0.13 + rnd() * 0.11, mine = [];
  for (let i = 0; i < n; i++) {
    let x = cx + gauss() * sigma, y = cy + gauss() * sigma, z = cz + gauss() * sigma;
    const l = Math.hypot(x, y, z); if (l > 1) { x /= l; y /= l; z /= l; }
    const id = addNode(x, y, z, col, false, rnd() < 0.07 ? 1.8 : 0.5 + rnd() * 0.7);
    addEdge(id, hub);
    if (mine.length && rnd() < 0.40) addEdge(id, mine[Math.max(0, mine.length - 1 - Math.floor(rnd() * 8))]);
    if (rnd() < 0.14) addEdge(id, hubs[Math.floor(rnd() * hubs.length)]);        // the long thin lines
    if (rnd() < 0.10) addEdge(id, core);                                          // the big hub reaches everywhere
    mine.push(id); members.push(id);
  }
}
{ // centre of mass on the middle, so the orb never sits lopsided
  let sx = 0, sy = 0, sz = 0;
  nodes.forEach(n => { sx += n.x; sy += n.y; sz += n.z; });
  sx /= nodes.length; sy /= nodes.length; sz /= nodes.length;
  nodes.forEach(n => { n.x -= sx; n.y -= sy; n.z -= sz; n.r = Math.hypot(n.x, n.y, n.z); });
  const rs = nodes.map(n => n.r).sort((a, b) => a - b), k = 0.82 / rs[Math.floor(rs.length * 0.92)];   // 92% of the network sits inside 0.82
  nodes.forEach(n => { n.x *= k; n.y *= k; n.z *= k; n.r *= k; });
}
for (let i = 1; i < hubs.length; i++) {                   // hubs know their neighbours
  const a = hubs[i]; let best = [];
  for (let j = 1; j < hubs.length; j++) if (j !== i) best.push([Math.hypot(nodes[a].x - nodes[hubs[j]].x, nodes[a].y - nodes[hubs[j]].y, nodes[a].z - nodes[hubs[j]].z), hubs[j]]);
  best.sort((p, q) => p[0] - q[0]); best.slice(0, 2).forEach(p => addEdge(a, p[1]));
}
for (let i = 0; i < 380; i++) {                           // cross-links: the web in the middle
  const a = members[Math.floor(rnd() * members.length)]; let best = -1, bd = 9;
  for (let t = 0; t < 14; t++) { const b = members[Math.floor(rnd() * members.length)];
    if (nodes[b].c === nodes[a].c) continue;
    const d = Math.hypot(nodes[a].x - nodes[b].x, nodes[a].y - nodes[b].y, nodes[a].z - nodes[b].z);
    if (d < bd) { bd = d; best = b; } }
  if (best >= 0) addEdge(a, best);
}
for (let i = 0; i < 14; i++) {                            // a few loose stars around her
  let x = gauss(), y = gauss(), z = gauss(); const l = Math.hypot(x, y, z) || 1, r = 1.05 + rnd() * 0.25;
  addNode(x / l * r, y / l * r, z / l * r, Math.floor(rnd() * PALETTE.length), false, 0.7);
}
const NN = nodes.length, adj = nodes.map(() => []);
edges.forEach(([a, b]) => { adj[a].push(b); adj[b].push(a); });
const hubEdges = edges.filter(([a, b]) => nodes[a].hub || nodes[b].hub);
const edgesByColor = PALETTE.map(() => []);
edges.forEach((e, i) => edgesByColor[nodes[e[0]].c].push(i));

/* ============================================================ behaviour per state ============================================================ */
const TARGET = {
  //            rotation  edge  node  spawn/s chain  speak listen think  glow   glow colour
  idle:      { rot: .05, edgeA: .22, nodeA: .78, rate: .9, chain: .25, wS: 0, wL: 0, wT: 0, glow: .10, gr: 110, gg: 130, gb: 255 },
  listening: { rot: .03, edgeA: .32, nodeA: .92, rate: 7,  chain: .30, wS: 0, wL: 1, wT: 0, glow: .20, gr: 80,  gg: 215, gb: 255 },
  thinking:  { rot: .40, edgeA: .34, nodeA: .88, rate: 30, chain: .62, wS: 0, wL: 0, wT: 1, glow: .22, gr: 165, gg: 130, gb: 255 },
  speaking:  { rot: .10, edgeA: .36, nodeA: .92, rate: 10, chain: .40, wS: 1, wL: 0, wT: 0, glow: .26, gr: 255, gg: 185, gb: 140 },
};
const P = Object.assign({}, TARGET.idle);
const net = { state: "offline", l: null, m: 0, hf: false };
let lvl = 0, mic = 0, ang = 0, t = 0, last = performance.now(), acc = 0;
const HN = 24, histS = new Float32Array(HN), histM = new Float32Array(HN); let head = 0;
const pulses = [], MAXP = reduce ? 60 : 190;

let LIGHT = false;                                         // light theme: darker inks, normal blending
const DKS = () => LIGHT ? 0.74 : 1;
const col = (q, a) => { const d = DKS(); return `rgba(${q[0] * d | 0},${q[1] * d | 0},${q[2] * d | 0},${a})`; };

const modeOf = () => net.state === "speaking" ? "out" : net.state === "listening" ? "in" : "any";
function spawn() {
  const mode = modeOf(); let e;
  if (mode === "any" && net.state === "thinking" && rnd() < 0.65) e = hubEdges[Math.floor(rnd() * hubEdges.length)];
  else {
    e = edges[Math.floor(rnd() * edges.length)];
    for (let i = 0; i < 3 && mode !== "any"; i++) {                         // start where the signal should start
      const c = edges[Math.floor(rnd() * edges.length)];
      const rc = Math.min(nodes[c[0]].r, nodes[c[1]].r), re = Math.min(nodes[e[0]].r, nodes[e[1]].r);
      const fc = Math.max(nodes[c[0]].r, nodes[c[1]].r), fe = Math.max(nodes[e[0]].r, nodes[e[1]].r);
      if (mode === "out" ? rc < re : fc > fe) e = c;
    }
  }
  let a = e[0], b = e[1];
  const flip = mode === "out" ? nodes[a].r > nodes[b].r : mode === "in" ? nodes[a].r < nodes[b].r : rnd() < 0.5;
  if (flip) { const x = a; a = b; b = x; }
  const speed = net.state === "thinking" ? 2.4 + rnd() * 2.2 : net.state === "idle" ? 0.5 + rnd() * 0.5 : 1.3 + rnd() * 1.4;
  pulses.push({ a, b, t: 0, sp: speed * (0.8 + 0.4 * MOTION), c: nodes[a].c });
}
function hop(from, prev) {
  const mode = modeOf(); let c = adj[from].filter(n => n !== prev);
  if (!c.length) return -1;
  if (mode !== "any") { const f = c.filter(n => mode === "out" ? nodes[n].r > nodes[from].r : nodes[n].r < nodes[from].r);
    if (!f.length) return rnd() < 0.7 ? -1 : c[Math.floor(rnd() * c.length)]; c = f; }
  return c[Math.floor(rnd() * c.length)];
}

/* ============================================================ drawing ============================================================ */
const cv = $("orb"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, CX = 0, CY = 0, R = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  CX = cv.width / 2; CY = cv.height * 0.42; R = Math.min(cv.width * 0.40, cv.height * 0.32);
}
addEventListener("resize", resize); resize();
const X = new Float32Array(NN), Y = new Float32Array(NN), S = new Float32Array(NN), HS = new Float32Array(NN), HM = new Float32Array(NN);

function targetLevel() {
  if (net.state !== "speaking") return 0;
  if (net.l !== null) return net.l;
  return Math.max(0.12, Math.min(1, 0.42 + 0.30 * Math.sin(t * 8.3) * Math.sin(t * 3.1 + 1) + 0.18 * (rnd() - 0.5)));   // no audio data (online voice): she breathes by herself
}

function draw(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
  const T = TARGET[net.state] || TARGET.idle, k = 1 - Math.exp(-dt * 3.2);
  for (const key in T) P[key] += (T[key] - P[key]) * k;
  const kk = Math.min(1, dt * 14);
  lvl += (targetLevel() - lvl) * kk; mic += ((net.state === "listening" ? net.m : 0) - mic) * kk;
  head = (head + 1) % HN; histS[head] = lvl; histM[head] = mic;
  ang += P.rot * MOTION * dt;
  const hf = net.hf ? 0.08 : 0;

  // projection + reactions
  const cr = Math.cos(ang), sr = Math.sin(ang), tilt = 0.38 + 0.05 * Math.sin(t * 0.13), ct = Math.cos(tilt), st = Math.sin(tilt);
  for (let i = 0; i < NN; i++) {
    const n = nodes[i];
    const dOut = Math.min(HN - 1, Math.round(n.r * 13)), dIn = Math.min(HN - 1, Math.round((1 - Math.min(1, n.r)) * 13));
    const hs = histS[(head - dOut + HN) % HN], hm = histM[(head - dIn + HN) % HN];
    HS[i] = hs; HM[i] = hm;
    const f = 1 + 0.012 * Math.sin(t * 0.9 * MOTION + n.r * 3 + n.ph * 0.2)
      + P.wS * 0.17 * hs * (0.75 + 0.25 * Math.sin(n.ph + t * 6))               // her voice: ripples spread outward
      - P.wL * 0.10 * hm * (0.8 + 0.2 * Math.sin(n.ph + t * 7))                 // your voice: the network draws inward
      + P.wT * 0.012 * Math.sin(t * 9 + n.ph * 3);                             // thinking: restless
    const x = n.x * f, y = n.y * f, z = n.z * f;
    const x1 = x * cr + z * sr, z1 = -x * sr + z * cr;
    const y1 = y * ct - z1 * st, z2 = y * st + z1 * ct;
    const s = 2.8 / (2.8 + z2);
    X[i] = CX + x1 * s * R; Y[i] = CY + y1 * s * R; S[i] = s;
  }

  ctx.globalCompositeOperation = "source-over";
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.globalCompositeOperation = LIGHT ? "source-over" : "lighter";
  const BOOST = LIGHT ? 1.45 : 1;                           // darker inks need more opacity to read

  // soft glow behind everything
  const ga = P.glow + P.wS * 0.30 * lvl + P.wL * 0.25 * mic + hf * 0.4;
  const g = ctx.createRadialGradient(CX, CY, 0, CX, CY, R * 1.25);
  g.addColorStop(0, `rgba(${P.gr | 0},${P.gg | 0},${P.gb | 0},${Math.min(0.5, ga) * (LIGHT ? 0.42 : 0.55)})`);
  g.addColorStop(1, `rgba(${P.gr | 0},${P.gg | 0},${P.gb | 0},0)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, cv.width, cv.height);

  // rings: converge while she listens, spread while she speaks
  const ringA = (w, ph, dirOut, amp) => { if (w < 0.02) return;
    const rad = R * (dirOut ? 0.6 + 0.6 * ph : 1.2 - 0.55 * ph);
    ctx.strokeStyle = `rgba(${P.gr * DKS() | 0},${P.gg * DKS() | 0},${P.gb * DKS() | 0},${(1 - ph) * 0.35 * w * amp * BOOST})`;
    ctx.lineWidth = 1.2 * DPR; ctx.beginPath(); ctx.arc(CX, CY, rad, 0, 6.283); ctx.stroke(); };
  for (let i = 0; i < 2; i++) {
    const ph = ((t * 0.55 + i / 2) % 1);
    ringA(P.wL, ph, false, 0.25 + mic * 0.75);
    ringA(P.wS, ph, true, 0.15 + lvl * 0.85);
  }

  // edges
  ctx.lineWidth = Math.max(0.6, 0.7 * DPR);
  const ea = Math.min(0.75, (P.edgeA + P.wS * 0.18 * lvl + P.wL * 0.12 * mic + hf * 0.5) * BOOST);
  for (let c = 0; c < PALETTE.length; c++) {
    const list = edgesByColor[c]; if (!list.length) continue;
    ctx.strokeStyle = col(RGB[c], ea); ctx.beginPath();
    for (let j = 0; j < list.length; j++) { const e = edges[list[j]]; ctx.moveTo(X[e[0]], Y[e[0]]); ctx.lineTo(X[e[1]], Y[e[1]]); }
    ctx.stroke();
  }

  // signals travelling along the edges
  acc += (P.rate * (0.55 + 0.45 * MOTION) + P.wS * 55 * lvl + P.wL * 30 * mic) * dt;
  while (acc >= 1) { acc -= 1; if (pulses.length < MAXP) spawn(); }
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i]; p.t += p.sp * dt;
    if (p.t >= 1) {
      const nx = rnd() < P.chain && pulses.length < MAXP ? hop(p.b, p.a) : -1;
      if (nx >= 0) { p.a = p.b; p.b = nx; p.t = 0; } else { pulses.splice(i, 1); continue; }
    }
    const x = X[p.a] + (X[p.b] - X[p.a]) * p.t, y = Y[p.a] + (Y[p.b] - Y[p.a]) * p.t;
    const t0 = Math.max(0, p.t - 0.22), x0 = X[p.a] + (X[p.b] - X[p.a]) * t0, y0 = Y[p.a] + (Y[p.b] - Y[p.a]) * t0;
    const q = RGB[p.c], sc = (S[p.a] + S[p.b]) / 2;
    ctx.strokeStyle = LIGHT ? col(q, 0.9) : `rgba(${(q[0] + 255) >> 1},${(q[1] + 255) >> 1},${(q[2] + 255) >> 1},0.75)`;
    ctx.lineWidth = 1.3 * DPR * sc;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x, y); ctx.stroke();
    ctx.fillStyle = LIGHT ? "rgba(20,24,50,0.9)" : "rgba(255,255,255,0.95)";
    ctx.beginPath(); ctx.arc(x, y, 1.8 * DPR * sc, 0, 6.283); ctx.fill();
    ctx.fillStyle = col(q, 0.28); ctx.beginPath(); ctx.arc(x, y, 5.5 * DPR * sc, 0, 6.283); ctx.fill();
  }

  // nodes
  for (let i = 0; i < NN; i++) {
    const n = nodes[i], q = RGB[n.c], s = S[i];
    const wave = P.wT * 0.35 * (0.5 + 0.5 * Math.sin(t * 5 - n.r * 9 + n.ph * 0.2));
    const a = Math.min(1, P.nodeA + wave + P.wS * 0.28 * HS[i] + P.wL * 0.32 * HM[i] + hf);
    const rad = (0.9 + n.size * 0.55) * s * DPR * (1 + 0.7 * (HS[i] * P.wS + HM[i] * P.wL));
    if (n.hub) { ctx.fillStyle = col(q, 0.10 * a * BOOST); ctx.beginPath(); ctx.arc(X[i], Y[i], rad * 4.2, 0, 6.283); ctx.fill(); }
    ctx.fillStyle = col(q, Math.min(1, a * (LIGHT ? 1.1 : 1))); ctx.beginPath(); ctx.arc(X[i], Y[i], rad, 0, 6.283); ctx.fill();
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

/* ============================================================ talking to her ============================================================ */
const api = (path, body) => fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Claire-Token": TOKEN },
  body: JSON.stringify(body || {}) }).then(r => r.json()).catch(() => ({}));
const LABEL = { idle: "Ready", listening: "Listening", thinking: "Thinking", speaking: "Speaking", offline: "Disconnected" };
const MODES = ["auto", "on", "off"]; let speakMode = "auto", fadeTimer = 0;

function setState(s) {
  if (net.state === s) return; net.state = s;
  $("dot").className = "dot " + (s === "idle" ? "" : s); $("stateText").textContent = LABEL[s] || s;
}
function showCaption() { clearTimeout(fadeTimer); $("caption").classList.remove("fade"); }
function fadeLater(ms) { clearTimeout(fadeTimer); fadeTimer = setTimeout(() => $("caption").classList.add("fade"), ms); }
function setNote(text, err) { const n = $("note"); n.textContent = text; n.className = "note" + (err ? " err" : ""); showCaption(); fadeLater(err ? 12000 : 7000); }

const es = new EventSource("/events?t=" + encodeURIComponent(TOKEN));
es.addEventListener("frame", ev => { const d = JSON.parse(ev.data); net.l = d.l; net.m = d.m; net.hf = d.hf; setState(d.s);
  $("hf").setAttribute("aria-pressed", d.hf ? "true" : "false"); });
es.addEventListener("status", ev => { const d = JSON.parse(ev.data); if (d.pending) showAsk(d.pending); speakMode = d.speak || speakMode;
  if (panel.classList.contains("open") && tab === "voice" && !$("speed").matches(":active")) refresh();
  $("mode").textContent = "Voice: " + speakMode;
  $("meta").textContent = [d.model, d.mouth && d.mouth.split("   [")[0]].filter(Boolean).join(" · "); });
es.addEventListener("user", ev => { const d = JSON.parse(ev.data); $("you").textContent = (d.spoken ? "🎤 " : "") + d.text;
  $("answer").textContent = ""; $("note").textContent = ""; showCaption(); });
es.addEventListener("claire_start", () => { $("answer").textContent = ""; showCaption(); });
es.addEventListener("token", ev => { $("answer").textContent += JSON.parse(ev.data).text; showCaption(); });
es.addEventListener("claire", ev => { $("answer").textContent = JSON.parse(ev.data).text; showCaption(); fadeLater(9000); });
es.addEventListener("claire_end", () => fadeLater(Math.max(7000, $("answer").textContent.length * 90)));
es.addEventListener("note", ev => setNote(JSON.parse(ev.data).text, false));
es.addEventListener("error", ev => { if (ev.data) setNote(JSON.parse(ev.data).text, true); });
es.onerror = () => { if (es.readyState === 2) { setState("offline"); setNote("My window lost its link to me. Close this window and start window.bat again.", true); } };

$("form").addEventListener("submit", e => { e.preventDefault(); const v = $("text").value.trim(); if (!v) return; $("text").value = ""; api("/api/say", { text: v }); });
$("talk").addEventListener("click", () => api("/api/talk"));
$("hf").addEventListener("click", () => api("/api/handsfree", { on: $("hf").getAttribute("aria-pressed") !== "true" }));
$("stop").addEventListener("click", () => api("/api/stop"));
$("mode").addEventListener("click", () => api("/api/mode", { mode: MODES[(MODES.indexOf(speakMode) + 1) % 3] }));
addEventListener("keydown", e => {
  if (e.key === "Escape") api("/api/stop");
  if (e.ctrlKey && e.code === "Space") { e.preventDefault(); api("/api/talk"); }
});
/* ============================================================ theme ============================================================ */
const THEMES = ["auto", "dark", "light"]; let themePref = "auto";
const sysLight = matchMedia("(prefers-color-scheme: light)");
function applyTheme() {
  LIGHT = themePref === "light" || (themePref === "auto" && sysLight.matches);
  document.documentElement.dataset.theme = LIGHT ? "light" : "dark";
  $("themeBtn").textContent = "Theme: " + themePref;
}
try { const s = localStorage.getItem("claire-theme"); if (THEMES.includes(s)) themePref = s; } catch (e) {}
sysLight.addEventListener && sysLight.addEventListener("change", applyTheme);
$("themeBtn").addEventListener("click", () => {
  themePref = THEMES[(THEMES.indexOf(themePref) + 1) % 3];
  try { localStorage.setItem("claire-theme", themePref); } catch (e) {}
  applyTheme();
});
applyTheme();

/* ============================================================ memory & journal panel ============================================================ */
let tab = "mem";
const panel = $("panel");
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function setPanel(open) {
  panel.classList.toggle("open", open); panel.setAttribute("aria-hidden", open ? "false" : "true");
  $("memBtn").setAttribute("aria-pressed", open ? "true" : "false");
  if (open) refresh(); else $("text").focus();
}
function setTab(t) {
  tab = t; $("tabMem").setAttribute("aria-pressed", t === "mem"); $("tabJour").setAttribute("aria-pressed", t === "jour");
  $("tabVoice").setAttribute("aria-pressed", t === "voice"); $("tabHands").setAttribute("aria-pressed", t === "hands");
  $("addText").placeholder = t === "mem" ? "Tell me something to remember…" : "Add a note to my journal…";
  $("coreLbl").style.display = t === "mem" ? "" : "none";
  $("addForm").hidden = t === "voice" || t === "hands"; $("speedBox").hidden = t !== "voice"; refresh();
}
let seq = 0;      // every refresh takes a ticket; an answer that arrives after a newer refresh started is dropped
async function refreshVoices(my) {
  const box = $("list"), r = await api("/api/voices");
  if (my !== seq) return;
  box.replaceChildren();
  if (!r.kind) { box.append(el("div", "empty", r.note || "I only have one voice with this setup.")); $("speedBox").hidden = true; return; }
  $("speed").value = r.speed; $("speedVal").textContent = (+r.speed).toFixed(2).replace(/0$/, "");
  for (const v of r.items) {
    const row = el("div", "item"), body = el("div", "txt"), line = el("div", "who");
    if (v.name === r.current) line.append(el("span", "now", "● "));
    line.append(document.createTextNode(v.who));
    body.append(line, el("div", "sub", v.desc));
    const acts = el("div", "acts"), tryB = el("button", "", "Try"), useB = el("button", "", "Use");
    tryB.type = useB.type = "button"; tryB.title = "Hear it (I go back to my own voice after)"; useB.title = "Keep this voice";
    tryB.addEventListener("click", () => api("/api/voice_try", { name: v.name }));
    useB.addEventListener("click", async () => { await api("/api/voice_use", { name: v.name }); refresh(); });
    acts.append(tryB, useB); row.append(body, acts); box.append(row);
  }
}
const WORDS = { asked: "asked you", done: "done", approved: "you said yes", denied: "you said no", refused: "refused",
                failed: "failed", expired: "no answer" };
async function refreshActions(my) {
  const box = $("list"), r = await api("/api/actions");
  if (my !== seq) return;
  box.replaceChildren();
  if (!r.enabled) { box.append(el("div", "empty", "My hands are switched off (settings.json → tools → enabled).")); return; }
  if (r.always.length) box.append(el("div", "empty", "I don't ask first for: " + r.always.join(", ")));
  if (!r.history.length) box.append(el("div", "empty", "Nothing yet. Ask me to open an app, find a file, or check the PC."));
  for (const h of r.history) {
    const row = el("div", "item"), body = el("div", "txt");
    body.append(el("div", "ev" + (h.event === "refused" || h.event === "failed" ? " bad" : ""), (WORDS[h.event] || h.event) + " · " + h.tool),
                el("div", "", h.text || ""), el("div", "sub", h.at));
    row.append(body); box.append(row);
  }
}
let asking = null;
function showAsk(items) {
  asking = items && items.length ? items[items.length - 1] : null;
  $("ask").classList.toggle("on", !!asking);
  document.querySelectorAll("#ask pre").forEach(n => n.remove());
  if (asking) {
    const q = $("askQ"); q.replaceChildren(document.createTextNode(asking.what + "?"), el("small", "", "Say yes or no, or tap a button."));
    if (asking.detail) $("ask").append(el("pre", "", asking.detail));
    $("askAlways").hidden = ["apply_change", "undo_change", "close_program"].includes(asking.tool);
  }
  if (panel.classList.contains("open") && tab === "hands") refresh();
}
const decide = (yes, always) => { if (asking) { const id = asking.id; asking = null; $("ask").classList.remove("on"); api("/api/approve", { id, yes, always }); } };
$("askYes").addEventListener("click", () => decide(true, false));
$("askNo").addEventListener("click", () => decide(false, false));
$("askAlways").addEventListener("click", () => decide(true, true));
$("tabHands").addEventListener("click", () => setTab("hands"));
es.addEventListener("pending", ev => showAsk(JSON.parse(ev.data).items));
es.addEventListener("actions", ev => { const d = JSON.parse(ev.data); showAsk(d.pending); });
async function refresh() {
  const my = ++seq, t = tab;                  // draw with the tab this request was made for, never whatever is current later
  if (t === "voice") return refreshVoices(my);
  if (t === "hands") return refreshActions(my);
  const box = $("list"), r = await api(t === "mem" ? "/api/memories" : "/api/journal"), items = r.items || [];
  if (my !== seq) return;
  box.replaceChildren();
  if (!items.length) { box.append(el("div", "empty", t === "mem" ? "Nothing yet. Tell me something below." : "My journal is empty.")); return; }
  for (const it of items) {
    const row = el("div", "item"), body = el("div", "txt");
    if (t === "mem") {
      const line = el("div"); if (it.kind === "core") line.append(el("span", "star", "★ ")); line.append(document.createTextNode(it.text));
      body.append(line, el("div", "sub", `#${it.id} · ${it.source} · ${it.created}`));
      const x = el("button", "", "Forget"); x.type = "button"; x.title = "Forget this";
      x.addEventListener("click", async () => { await api("/api/forget", { id: it.id }); refresh(); });
      row.append(body, x);
    } else {
      body.append(el("div", "", it.title), el("div", "sub", it.at + (it.detail ? " · " + it.detail : "")));
      row.append(body);
    }
    box.append(row);
  }
}
$("memBtn").addEventListener("click", () => setPanel(!panel.classList.contains("open")));
$("panelClose").addEventListener("click", () => setPanel(false));
$("tabMem").addEventListener("click", () => setTab("mem"));
$("tabJour").addEventListener("click", () => setTab("jour"));
$("tabVoice").addEventListener("click", () => setTab("voice"));
$("voiceBtn").addEventListener("click", () => { setTab("voice"); setPanel(true); });
let speedTimer = 0;
$("speed").addEventListener("input", () => { $("speedVal").textContent = (+$("speed").value).toFixed(2).replace(/0$/, "");
  clearTimeout(speedTimer); speedTimer = setTimeout(() => api("/api/speed", { value: +$("speed").value }), 350); });
$("addForm").addEventListener("submit", async e => {
  e.preventDefault(); const v = $("addText").value.trim(); if (!v) return;
  await api(tab === "mem" ? "/api/remember" : "/api/journal_add", { text: v, core: $("addCore").checked });
  $("addText").value = ""; $("addCore").checked = false; refresh();
});
addEventListener("keydown", e => { if (e.key === "Escape" && panel.classList.contains("open")) setPanel(false); });
$("text").focus();
</script>
</body>
